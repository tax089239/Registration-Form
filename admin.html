<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>活動報到後台</title>

<style>
body{
  font-family:"Microsoft JhengHei";
  background:#f5f5f5;
  margin:0;
  padding:20px;
}

.container{
  background:#fff;
  max-width:1300px;
  margin:auto;
  padding:20px;
  border-radius:20px;
}

h1{ margin-top:0; }

.stats{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.card{
  flex:1;
  background:#1976d2;
  color:#fff;
  text-align:center;
  padding:15px;
  border-radius:10px;
}

.card div{
  font-size:26px;
  font-weight:bold;
  margin-top:5px;
}

#search{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-bottom:15px;
  box-sizing:border-box;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#1976d2;
  color:#fff;
}

/* 狀態 */
.status-ok{ color:#1976d2; font-weight:bold; }
.status-done{ color:#2e7d32; font-weight:bold; }
.status-bad{ color:#d32f2f; font-weight:bold; }

/* 按鈕 */
.btn{
  padding:6px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-size:14px;
}

.btn-green{
  background:#2e7d32;
  color:#fff;
}

.btn-green:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.small{
  color:#888;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 活動報到後台</h1>

<!-- 統計 -->
<div class="stats">
  <div class="card">總數<div id="total">0</div></div>
  <div class="card">已報到<div id="checked">0</div></div>
  <div class="card">未報到<div id="notyet">0</div></div>
</div>

<!-- 搜尋 -->
<input id="search" placeholder="搜尋姓名 / 電話 / 序號..." oninput="renderFiltered()">

<table>
<thead>
<tr>
  <th>序號</th>
  <th>姓名</th>
  <th>電話</th>
  <th>狀態</th>
  <th>時間</th>
  <th>操作</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbx2fLcCaE7WIHoRNbJdtlrHQxO1miu8wW6j0M2NfWRai4qO7l34rvTdeXuRUOfBRRx_/exec";

let dataAll = [];
let lock = false;

/* 初始化 */
window.onload = () => {
  load();
  autoRefresh();
};

/* 🔥 降頻穩定更新 */
function autoRefresh(){
  setInterval(() => {
    load(false);
  }, 6000); // 👉 6秒（比你現在更穩）
}

/* 讀資料 */
function load(){
  fetch(`${API}?action=all`)
    .then(r => r.json())
    .then(res => {
      dataAll = res;
      render(res);
    });
}

/* 渲染 */
function render(data){

  let html = "";

  data.forEach(row => {

    const status = row.status || "未報到";

    let cls = "";
    if(status === "已報到") cls = "status-done";
    else if(status === "報名成功") cls = "status-ok";
    else if(status.includes("不成功")) cls = "status-bad";

    let btn = "";

    if(status === "報名成功"){
      btn = `<button class="btn btn-green"
              onclick="checkin('${row.code}', this)">
              確認報到
             </button>`;
    } else if(status === "已報到"){
      btn = `<span class="small">✔ 完成</span>`;
    } else {
      btn = `<span class="small">-</span>`;
    }

    html += `
    <tr id="row-${row.code}">
      <td>${row.serial || ""}</td>
      <td>${row.name || ""}</td>
      <td>${row.phone || ""}</td>
      <td class="${cls}">${status}</td>
      <td>${row.time || ""}</td>
      <td>${btn}</td>
    </tr>`;
  });

  document.getElementById("tbody").innerHTML = html;

  updateStats(data);
}

/* 🔥 統計 */
function updateStats(data){
  const total = data.filter(x => x.status && !x.status.includes("不成功")).length;
  const checked = data.filter(x => x.status === "已報到").length;

  document.getElementById("total").innerText = total;
  document.getElementById("checked").innerText = checked;
  document.getElementById("notyet").innerText = total - checked;
}

/* 🔥 報到（穩定版） */
function checkin(code, btn){

  if(lock) return;
  lock = true;

  btn.disabled = true;

  fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: "update",
      code: code,
      status: "已報到"
    })
  })
  .then(r => r.json())
  .then(res => {

    lock = false;
    btn.disabled = false;

    if(res.success){

      // 🔥 不整頁 reload，只更新資料
      const target = dataAll.find(x => x.code == code);
      if(target){
        target.status = "已報到";
        target.time = "剛更新";
      }

      render(dataAll);

    }else{
      alert("更新失敗");
    }
  })
  .catch(() => {
    lock = false;
    btn.disabled = false;
    alert("網路錯誤");
  });
}

/* 搜尋 */
function renderFiltered(){

  const key = document.getElementById("search").value.toLowerCase();

  if(!key){
    render(dataAll);
    return;
  }

  const filtered = dataAll.filter(r =>
    (r.name && r.name.includes(key)) ||
    (r.phone && r.phone.includes(key)) ||
    (String(r.serial).includes(key))
  );

  render(filtered);
}

</script>

</body>
</html>
