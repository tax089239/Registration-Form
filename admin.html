<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> 活動報到後台 </title>

<style>
body{
  font-family:"Microsoft JhengHei";
  background:#f4f6f9;
  margin:0;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:16px;
}

h1{ margin-top:0; }

.stats{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.card{
  flex:1;
  background:#1976d2;
  color:#fff;
  text-align:center;
  padding:12px;
  border-radius:10px;
}

.card div{
  font-size:24px;
  font-weight:bold;
}

input, button{
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  cursor:pointer;
  border:none;
}

.btn-green{ background:#2e7d32; color:#fff; }
.btn-blue{ background:#1976d2; color:#fff; }

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
}

th{ background:#1976d2; color:#fff; }

.status-done{ color:#2e7d32; font-weight:bold;}
.status-success{ color:#ff9800; font-weight:bold;}
.status-error{ color:#d32f2f; font-weight:900;}

#loginBox{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#000000aa;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-panel{
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:280px;
  text-align:center;
}
</style>
</head>

<body>

 <div class="container" id="main">
   
<h1>
  📊 活動報到後台
  <span id="syncStatus"
        style="font-size:14px;margin-left:10px;color:#2e7d32;">
    🟢 已連線
  </span>
</h1>

<div class="stats">
  <div class="card">總數<div id="total">0</div></div>
  <div class="card">已報到<div id="checked">0</div></div>
  <div class="card">未報到<div id="notyet">0</div></div>
</div>

<button class="btn-blue" onclick="exportExcel()">📥 匯出 CSV</button>

<input id="search" placeholder="搜尋姓名/電話/序號" oninput="searchData()">

<table>
<thead>
<tr>
  <th>序號</th>
  <th>姓名</th>
  <th>電話</th>
  <th>狀態</th>
  <th>時間</th>
  <th>操作</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzDh8pr8SqZ289aMswVMJrYsmMR2W0sErjnO7X8cUeX6clQUlCnJaol12pb9k-c9ijF/exec";

/* ===== 狀態 ===== */
let dataAll = [];
let searchTimer = null;
let lastHash = "";
const checkinLock = new Set();
let loading = false;
let searching = false;
let syncTimer = null;

window.onload = () => {
  start();
};
  
/* ===== 啟動同步 ===== */
function start(){
  load();
  if(syncTimer){
    clearInterval(syncTimer);
  }
  syncTimer = setInterval(load, 2000);
}
  
/* ===== 讀取資料 ===== */
/* 優化後的邏輯：同步不中斷，但搜尋時維持過濾 */
async function load(){
  if(loading) return;
  loading = true;
  try{
    const res = await fetch(API + "?action=all");
    const data = await res.json();
    document.getElementById("syncStatus").innerText = "🟢 已連線";
    dataAll = data;
    // 檢查搜尋框是否有字
    const key = document.getElementById("search").value.trim().toLowerCase();
    if(key) {
      const filtered = dataAll.filter(r => 
        String(r.name + r.phone + r.serial).toLowerCase().includes(key)
      );
      render(filtered);
    } else {
      render(dataAll);
    }
  }catch(err){
    document.getElementById("syncStatus").innerText = "🔴 連線失敗";
  }finally{
    loading = false;
  }
}
  
/* ===== 畫面更新 ===== */
function render(data){
  let html = "";
  let total = 0;
  let checked = 0;
  data.forEach(r => {
    const status = r.checkinStatus || "";
    const time = r.time || "";
    let statusClass = "status-error";
    if (status === "已報到") {
      statusClass = "status-done";
      checked++;
    }
    if (r.name) total++;
    html += `
      <tr>
        <td>${r.serial || ""}</td>
        <td>${r.name || ""}</td>
        <td>${r.phone || ""}</td>
        <td class="${statusClass}">
          ${status || "未報到"}
        </td>
        <td>${time}</td>
        <td>
          ${
            status === "已報到"
              ? `<span style="color:#2e7d32;font-weight:bold;">✔ 已報到</span>`
              : `<button class="btn-green" onclick="checkin('${r.code}',this)">報到</button>`
          }
        </td>
      </tr>
    `;
  });
  document.getElementById("tbody").innerHTML = html;
  document.getElementById("total").innerText = total;
  document.getElementById("checked").innerText = checked;
  document.getElementById("notyet").innerText = total - checked;
}

/* ===== 報到 ===== */
/* 報到改用 GET 避免 CORS 報錯 */
function checkin(code, btn) {
  if (btn.disabled) return;
  if (checkinLock.has(code)) return;
  checkinLock.add(code);
  btn.disabled = true;
  btn.innerText = "處理中...";

  // 改成 GET 傳遞 update 動作
  fetch(`${API}?action=update&code=${code}`)
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        load(); // 重新讀取列表
      } else {
        alert("報到失敗：" + (res.msg || "未知錯誤"));
      }
    })
    .catch(err => {
      console.error(err);
      alert("網路連線異常");
    })
    .finally(() => {
      setTimeout(() => {
        checkinLock.delete(code);
        btn.disabled = false;
        btn.innerText = "報到";
      }, 800);
    });
}

/* ===== 搜尋 ===== */
function searchData(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    const key =
      document.getElementById("search")
      .value
      .trim()
      .toLowerCase();
    if(!key){
      searching = false;
      render(dataAll);
      return;
    }
    searching = true;
    const filtered = dataAll.filter(r =>
      (r.name || "")
      .toLowerCase()
      .includes(key)
      ||
      String(r.phone || "")
      .includes(key)
      ||
      String(r.serial || "")
      .toLowerCase()
      .includes(key)
    );
    render(filtered);
  },200);
}

/* ===== 匯出CSV ===== */
function exportExcel(){
  let csv = "\uFEFF序號,姓名,電話,狀態,時間\n";
  dataAll.forEach(r=>{
    csv +=
      `${r.serial || ""},` +
      `${r.name || ""},` +
      `${r.phone || ""},` +
      `${r.checkinStatus || r.status || ""},` +
      `${r.time || ""}\n`;
  });
  const blob = new Blob(
    [csv],
    {type:"text/csv;charset=utf-8;"}
  );
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "報到名單.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
  
</script>

</body>
</html>
