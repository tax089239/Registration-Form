<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動報到查詢</title>

<style>
body{
  font-family:"Microsoft JhengHei";
  background:#f5f7fb;
  margin:0;
  padding:16px;
}

.container{
  max-width:520px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:16px;
}

input,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  background:#1976d2;
  color:#fff;
  border:none;
}

.success{ color:#2e7d32; font-size:22px; font-weight:bold; text-align:center; }
.error{ color:#d32f2f; text-align:center; }
.name{ text-align:center; font-size:18px; }
.serial{ text-align:center; font-size:30px; font-weight:bold; color:#ff9800; }

</style>
</head>

<body>

<div class="container">

<h3 style="text-align:center;">活動報到查詢</h3>

<div id="result"></div>

<input id="name" placeholder="姓名">
<input id="phone" placeholder="手機末三碼">
<button onclick="submit()">查詢 / 報到</button>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzGuH6GDFiFz6kbrT64x88Pq33ll0rHpNOe7HpM8ydlD8tAsBHMnSKvLjJA4HZDHovg/exec";

let loading=false;

function submit(){

  if(loading) return;

  const name=document.getElementById("name").value;
  const phone=document.getElementById("phone").value;

  if(!name||!phone){
    alert("請輸入完整資料");
    return;
  }

  loading=true;

  fetch(`${API}?action=checkin&name=${encodeURIComponent(name)}&phone=${phone}`)
  .then(r=>r.json())
  .then(res=>{
    render(res);
  })
  .finally(()=>{
    loading=false;
  });
}

function render(data){

  if(!data.success){
    document.getElementById("result").innerHTML=
    `<div class="error">${data.message||"查無資料"}</div>`;
    return;
  }

  document.getElementById("result").innerHTML=`
    <div class="success">${data.already?"已報到":"報到成功"}</div>
    <div class="name">${data.name||""}</div>
    <div class="serial">${data.serial||""}</div>
  `;
}

</script>

</body>
</html>
