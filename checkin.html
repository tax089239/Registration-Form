<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>活動序號查詢系統</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:"Microsoft JhengHei";
  background:#f5f7fb;
  height:100%;
  overflow:hidden; /* 🔥 防手機鍵盤爆版核心 */
}

/* 🔥 改成安全滾動架構 */
body{
  display:block;
  padding:16px;
}

/* 🔥 主容器（不再 flex center） */
.container{
  width:100%;
  max-width:520px;

  height:calc(100vh - 32px); /* 🔥 核心修正 */
  margin:auto;

  background:#fff;
  padding:24px;
  border-radius:20px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

/* 🔥 結果區可滾動 */
#result{
  flex:1;
  overflow-y:auto;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:10px 0;
}

/* 字體 RWD */
.success{
  color:#ff0000;
  font-size:clamp(24px,6vw,36px);
  font-weight:bold;
  text-align:center;
}

.name-display{
  font-size:clamp(18px,5vw,24px);
  text-align:center;
}

.serial{
  color:#ff9800;
  font-size:clamp(28px,8vw,48px);
  font-weight:bold;
  text-align:center;
}

.footer-note{
  color:#666;
  font-size:14px;
  margin-top:10px;
  text-align:center;
  border-top:1px dashed #ccc;
  padding-top:10px;
}

.reject-msg{
  color:#d32f2f;
  font-size:clamp(18px,5vw,24px);
  font-weight:bold;
  text-align:center;
}

.error{
  color:#ff0000;
  text-align:center;
}

/* input 固定底部區 */
input{
  width:100%;
  padding:14px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ccc;
  text-align:center;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  background:#1976d2;
  color:#fff;
  border-radius:10px;
  font-size:18px;
}

/* 🔥 手機安全 */
@media (max-width:480px){
  .container{
    padding:16px;
    border-radius:14px;
  }
}

</style>
</head>

<body>

<div class="container">

  <h2 style="text-align:center;margin:0 0 10px;">活動序號查詢</h2>

  <div id="result"></div>

  <div>
    <input id="name" placeholder="姓名">
    <input id="phone" placeholder="手機末三碼">
    <button onclick="manualCheckin()">查詢</button>
  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzW_WJxAEJBvmEeHG5SfUZPsTV5M41ngYctUC6m65cVmf9RSIc3FcKBRddCubpmzd63/exec";

let isLoading = false;

function manualCheckin(){
  if(isLoading) return;

  const btn = document.querySelector("button");
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if(!name || !phone){
    alert("請輸入完整資料");
    return;
  }

  isLoading = true;
  btn.disabled = true;

  sendCheckin(name, phone);
}

async function sendCheckin(name, phone){
  try{
    const url = `${API}?action=checkin&name=${encodeURIComponent(name)}&phone=${phone}`;
    const res = await fetch(url);
    const data = await res.json();

    render(data);

    if(data.success || data.already){
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
    }

  }catch(e){
    render({success:false,message:"連線失敗"});
  }

  setTimeout(()=>{
    isLoading = false;
    document.querySelector("button").disabled = false;
  },600);
}

function render(data){

  if(data.status && (data.status.includes("不成功") || data.status.includes("未成功"))){
    result().innerHTML = `<div class="reject-msg">報名未成功<br>請洽服務台</div>`;
    return;
  }

  if(data.success || data.already){
    result().innerHTML = `
      <div class="success">${data.already ? "已報到" : "報到成功"}</div>
      <div class="name-display">${data.name || ""}</div>
      <div class="serial">${data.serial || ""}</div>
      <div class="footer-note">請至服務台兌換</div>
    `;
    return;
  }

  result().innerHTML = `<div class="error">${data.message || "查無資料"}</div>`;
}

/* Enter送出 */
document.addEventListener("keydown", e=>{
  if(e.key==="Enter") manualCheckin();
});

const result = ()=>document.getElementById("result");

</script>

</body>
</html>
