<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>活動報到系統</title>

<style>
body {
  font-family: Arial;
  background:#f5f5f5;
  padding:20px;
}

.card {
  background:#fff;
  padding:20px;
  border-radius:10px;
  max-width:500px;
  margin:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input, button {
  width:100%;
  padding:10px;
  margin-top:10px;
  font-size:16px;
}

button {
  background:#4CAF50;
  color:#fff;
  border:none;
  cursor:pointer;
  border-radius:6px;
}

button:hover {
  background:#45a049;
}

.result {
  margin-top:15px;
  padding:10px;
  background:#eee;
  border-radius:6px;
  white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="card">
  <h2>活動報到系統</h2>

  <input id="name" placeholder="姓名">
  <input id="phone" placeholder="電話後三碼">

  <button onclick="query()">查詢報名</button>
  <button onclick="checkin()">報到</button>

  <div class="result" id="result">等待操作...</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbx2fLcCaE7WIHoRNbJdtlrHQxO1miu8wW6j0M2NfWRai4qO7l34rvTdeXuRUOfBRRx_/exec";

// 查詢
async function query(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  const url = `${API}?action=query&name=${encodeURIComponent(name)}&phone=${phone}`;

  const res = await fetch(url);
  const data = await res.json();

  document.getElementById("result").innerText =
    JSON.stringify(data, null, 2);
}

// 報到
async function checkin(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  const url = `${API}?action=checkin&name=${encodeURIComponent(name)}&phone=${phone}`;

  const res = await fetch(url);
  const data = await res.json();

  document.getElementById("result").innerText =
    JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
